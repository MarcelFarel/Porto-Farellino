<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img" aria-label="Farellino Audric Portrait Placeholder">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="0.75" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.2" cy="0.8" r="0.6">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="600" height="720" fill="url(#bgGrad)"/>
  <rect width="600" height="720" fill="url(#glowAmber)"/>
  <rect width="600" height="720" fill="url(#glowCyan)"/>

  <!-- Subtle architectural grid lines -->
  <g stroke="#334155" stroke-opacity="0.28" stroke-width="1">
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="120" y1="0" x2="120" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="360" y1="0" x2="360" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
  </g>

  <!-- Glowing Halo Ring behind avatar -->
  <circle cx="300" cy="285" r="148" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.7"/>
  <circle cx="300" cy="285" r="126" fill="#0B1120" fill-opacity="0.65" stroke="#334155" stroke-width="1.5"/>

  <!-- Stylized Modern Developer Silhouette -->
  <!-- Shoulders / Jacket -->
  <path d="M105 690 C115 525, 200 465, 300 465 C400 465, 485 525, 495 690 Z" fill="url(#suitGrad)" stroke="#475569" stroke-width="2"/>
  <!-- Collar / Inner Shirt Accent -->
  <path d="M245 472 L300 565 L355 472" fill="#0F172A" stroke="#F59E0B" stroke-width="2.5"/>
  <!-- Neck -->
  <rect x="272" y="395" width="56" height="82" rx="24" fill="#CBD5E1"/>
  <!-- Head -->
  <rect x="218" y="195" width="164" height="215" rx="76" fill="#E2E8F0"/>
  <!-- Stylized Hair -->
  <path d="M214 268 C210 198, 255 162, 312 166 C365 170, 392 205, 384 268 C372 232, 344 218, 298 220 C255 222, 232 240, 214 268 Z" fill="#0F172A"/>
  <!-- Glasses (Modern Tech Frame) -->
  <g stroke="#0F172A" stroke-width="5" fill="#38BDF8" fill-opacity="0.16">
    <rect x="240" y="274" width="50" height="34" rx="8"/>
    <rect x="310" y="274" width="50" height="34" rx="8"/>
    <line x1="290" y1="289" x2="310" y2="289" fill="none"/>
  </g>
  <!-- Subtle Smile -->
  <path d="M278 356 Q300 370 322 356" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Monogram Badge on Lapel -->
  <rect x="355" y="545" width="54" height="28" rx="6" fill="#F59E0B"/>
  <text x="382" y="564" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#07090E" text-anchor="middle">FA'27</text>
</svg>
